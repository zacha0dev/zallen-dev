# deploy.yml - the node's self-deploy workflow (template).
#
# Copy this to .github/workflows/deploy.yml in the repo that hosts your node,
# then the node can update itself by calling its github_dispatch_workflow tool
# (workflow: deploy.yml). It can also be run manually from the Actions tab.
#
# Required repo secrets:
#   AZURE_CREDENTIALS   - output of `az ad sp create-for-rbac --sdk-auth`,
#                         scoped to the node's resource group.
#   FUNCTION_APP_NAME   - the deployed Function App name (from the bicep output).
#   RESOURCE_GROUP      - the node's resource group (rg-<nodeName>).
#
# Deploy uses the `az` CLI zip path (NOT Azure/functions-action@v1). The
# marketplace functions-action can be blocked from download by a GitHub TOS
# block on an account ("Repository access blocked" at "Set up job"); the `az`
# CLI is preinstalled on the runner, needs no action download, and
# `config-zip` drives the Linux-Consumption run-from-package upload a raw Kudu
# zipdeploy can't.
name: deploy
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: mcp-node/src
        run: npm ci

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions (az CLI config-zip)
        env:
          APP_NAME:       ${{ secrets.FUNCTION_APP_NAME }}
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
        working-directory: mcp-node/src
        run: |
          set -euo pipefail
          if [ -z "${APP_NAME:-}" ] || [ -z "${RESOURCE_GROUP:-}" ]; then
            echo "::error::Missing FUNCTION_APP_NAME and/or RESOURCE_GROUP repo secrets."
            exit 1
          fi
          # Package the app dir: host.json at zip root + package.json +
          # node_modules + src. Drop git/local settings.
          zip -qr "$RUNNER_TEMP/app.zip" . -x '*.git*' 'local.settings.json*'
          echo "Package: $(du -h "$RUNNER_TEMP/app.zip" | cut -f1)"
          az functionapp deployment source config-zip \
            -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --src "$RUNNER_TEMP/app.zip" --build-remote false --timeout 900
          echo "Deploy complete."
